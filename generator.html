<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор каталога Tea Qi</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #fafaf7; padding: 40px 20px; color: #1a1d1a; line-height: 1.6; }
  .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.05); }
  h1 { margin-top: 0; color: #5f7840; }
  .desc { font-size: 0.95rem; color: #8a9278; margin-bottom: 24px; }
  .step { background: #f2f4ec; border-left: 4px solid #7a9556; padding: 16px; border-radius: 8px; margin-bottom: 24px; font-size: 0.92rem; }
  .step strong { color: #5f7840; }
  label { display: block; font-weight: 600; margin-bottom: 8px; margin-top: 20px; }
  input[type="file"] { width: 100%; padding: 12px; border: 2px dashed #d0d9b8; border-radius: 8px; font-size: 1rem; margin-bottom: 16px; background: #fafaf7; cursor: pointer; box-sizing: border-box; }
  input[type="file"]:hover { border-color: #7a9556; }
  button { background: #7a9556; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  button:hover { background: #5f7840; }
  .status { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; }
  .status.error { display: block; background: #fbe4ee; color: #b04a76; }
  .status.success { display: block; background: #d9f2ea; color: #2d7a65; }
  textarea { width: 100%; height: 400px; margin-top: 20px; padding: 16px; border: 1px solid #d0d9b8; border-radius: 8px; font-family: monospace; font-size: 0.85rem; box-sizing: border-box; background: #fafaf7; resize: vertical; }
</style>
</head>
<body>
<div class="container">
  <h1>🍵 Генератор каталога Tea Qi</h1>
  <p class="desc">Самый стабильный способ без ошибок CORS.</p>

  <div class="step">
    <strong>Шаг 1.</strong> В вашей Google-таблице нажмите <strong>Файл → Скачать → CSV</strong>. Файл сохранится на компьютер.<br>
    <strong>Шаг 2.</strong> Загрузите этот файл в поле ниже.
  </div>

  <label>Загрузите CSV-файл:</label>
  <input type="file" id="csvFile" accept=".csv">

  <button onclick="generate()">Сгенерировать код</button>

  <div id="status" class="status"></div>

  <div id="outputBlock" style="display:none; margin-top:24px;">
    <label>Готовый код для вставки в tea-qi.html:</label>
    <textarea id="outputCode" readonly onclick="this.select()"></textarea>
  </div>
</div>

<script>
async function generate() {
  const fileInput = document.getElementById('csvFile');
  const status = document.getElementById('status');
  const outputBlock = document.getElementById('outputBlock');
  const outputCode = document.getElementById('outputCode');

  if (!fileInput.files.length) {
    status.className = 'status error';
    status.textContent = 'Сначала загрузите CSV-файл';
    return;
  }

  status.className = 'status';
  status.textContent = 'Обрабатываю файл...';
  status.style.display = 'block';
  outputBlock.style.display = 'none';

  try {
    const file = fileInput.files[0];
    const csvText = await file.text();

    const rows = parseCSV(csvText);
    if (rows.length < 2) throw new Error('В файле нет данных (нужен заголовок и хотя бы одна строка).');

    const headers = rows[0].map(h => h.toLowerCase().trim());
    const idx = {
      category: headers.findIndex(h => h.includes('категор') || h.includes('тип')),
      name: headers.findIndex(h => h.includes('назван') || h.includes('имя')),
      price: headers.findIndex(h => h.includes('цена') || h.includes('стоим')),
      weight: headers.findIndex(h => h.includes('вес') || h.includes('грамм')),
      desc: headers.findIndex(h => h.includes('описан')),
      stock: headers.findIndex(h => h.includes('налич') || h.includes('статус')),
      image: headers.findIndex(h => h.includes('картин') || h.includes('фото') || h.includes('изображ'))
    };

    if (idx.name === -1 || idx.price === -1) throw new Error('Не найдены обязательные колонки: Название и Цена.');

    let htmlOutput = '';

    rows.slice(1).forEach(row => {
      if (!row[idx.name] || !row[idx.name].trim()) return;

      const name = row[idx.name] || '';
      const price = idx.price > -1 ? (row[idx.price] || '') : '';
      const weight = idx.weight > -1 ? (row[idx.weight] || '') : '';
      const category = idx.category > -1 ? (row[idx.category] || '') : '';
      const stock = idx.stock > -1 ? (row[idx.stock] || '').toLowerCase() : '';
      const image = idx.image > -1 ? (row[idx.image] || '') : '';

      const isAvailable = !stock.includes('нет');
      const opacity = isAvailable ? '1' : '0.5';
      const visualStyle = image ? `background-image: url('${image}'); background-size: cover; background-position: center; color: transparent;` : `color: var(--sage);`;
      const fallbackChar = category ? category.charAt(0) : '茶';

      htmlOutput += `
    <!-- Карточка: ${name} -->
    <div class="tq-tile tq-product" style="opacity: ${opacity};">
      <div class="tq-product-visual" style="${visualStyle}">
        ${!image ? fallbackChar : ''}
      </div>
      <div class="tq-product-info">
        <h4>${name} ${weight ? '<span style="font-size: 0.8em; color: var(--muted);">(' + weight + ')</span>' : ''}</h4>
        <span class="price">${price}</span>
      </div>
    </div>`;
    });

    outputCode.value = htmlOutput;
    outputBlock.style.display = 'block';
    status.className = 'status success';
    status.textContent = `Готово! Сгенерировано ${rows.length - 1} карточек. Скопируйте код ниже.`;

  } catch (err) {
    status.className = 'status error';
    status.textContent = 'Ошибка: ' + err.message;
    console.error(err);
  }
}

function parseCSV(text) {
  const lines = [];
  let currentLine = [];
  let currentCell = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const nextChar = text[i + 1];

    if (inQuotes) {
      if (char === '"' && nextChar === '"') { currentCell += '"'; i++; }
      else if (char === '"') { inQuotes = false; }
      else { currentCell += char; }
    } else {
      if (char === '"') { inQuotes = true; }
      else if (char === ',') { currentLine.push(currentCell); currentCell = ''; }
      else if (char === '\n' || (char === '\r' && nextChar === '\n')) {
        if (char === '\r') i++; 
        currentLine.push(currentCell);
        lines.push(currentLine);
        currentLine = []; currentCell = '';
      } else { currentCell += char; }
    }
  }
  if (currentCell || currentLine.length > 0) {
    currentLine.push(currentCell);
    lines.push(currentLine);
  }
  return lines;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор каталога Tea Qi</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #fafaf7; padding: 40px 20px; color: #1a1d1a; line-height: 1.6; }
  .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.05); }
  h1 { margin-top: 0; color: #5f7840; }
  .desc { font-size: 0.95rem; color: #8a9278; margin-bottom: 24px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input[type="text"] { width: 100%; padding: 12px; border: 1px solid #d0d9b8; border-radius: 8px; font-size: 1rem; margin-bottom: 16px; box-sizing: border-box; }
  button { background: #7a9556; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:hover { background: #5f7840; }
  .status { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; }
  .status.error { display: block; background: #fbe4ee; color: #b04a76; }
  .status.success { display: block; background: #d9f2ea; color: #2d7a65; }
  textarea { width: 100%; height: 350px; margin-top: 20px; padding: 16px; border: 1px solid #d0d9b8; border-radius: 8px; font-family: monospace; font-size: 0.85rem; box-sizing: border-box; background: #fafaf7; resize: vertical; }
</style>
</head>
<body>
<div class="container">
  <h1>🍵 Генератор каталога Tea Qi</h1>
  <p class="desc">Вставьте ссылку на вашу Google Таблицу (режим редактирования или просмотра). Скрипт сам преобразует её в формат для чтения данных.</p>
  
  <label>Ссылка на Google Таблицу:</label>
  <input type="text" id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/1.../edit#gid=0">
  
  <button onclick="generate()">Сгенерировать код</button>
  
  <div id="status" class="status"></div>
  
  <div id="outputBlock" style="display:none; margin-top:24px;">
    <label>Готовый код для вставки в tea-qi.html:</label>
    <textarea id="outputCode" readonly onclick="this.select()"></textarea>
  </div>
</div>

<script>
async function generate() {
  const url = document.getElementById('sheetUrl').value.trim();
  const status = document.getElementById('status');
  const outputBlock = document.getElementById('outputBlock');
  const outputCode = document.getElementById('outputCode');

  if (!url) {
    status.className = 'status error';
    status.textContent = 'Вставьте ссылку на таблицу';
    return;
  }

  status.className = 'status';
  status.textContent = 'Загружаю данные...';
  status.style.display = 'block';
  outputBlock.style.display = 'none';

  try {
    // Автоматически преобразуем ссылку редактирования в ссылку экспорта CSV
    let fetchUrl = url;
    
    // Извлекаем ID таблицы и GID
    const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if (!match) throw new Error('Неверный формат ссылки. Скопируйте ссылку из адресной строки Google Таблиц.');
    
    const spreadsheetId = match[1];
    const gidMatch = url.match(/[#&]gid=([0-9]+)/);
    const gid = gidMatch ? gidMatch[1] : '0';
    
    // Формируем прямую ссылку на CSV экспорт (работает для таблиц с доступом "Читатель по ссылке")
    fetchUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv&gid=${gid}`;

    const response = await fetch(fetchUrl);
    if (!response.ok) {
        throw new Error('Не удалось получить доступ. Убедитесь, что в настройках доступа таблицы стоит "Все, у кого есть ссылка - Читатель".');
    }
    
    const csvText = await response.text();
    
    // Проверка, не вернулась ли HTML-страница логина вместо CSV
    if (csvText.includes('<!DOCTYPE html>') || csvText.includes('<html')) {
        throw new Error('Google вернул страницу входа. Откройте доступ к таблице по ссылке (Читатель).');
    }

    const rows = parseCSV(csvText);
    if (rows.length < 2) throw new Error('В таблице нет данных (нужен заголовок и хотя бы одна строка).');

    const headers = rows[0].map(h => h.toLowerCase().trim());
    
    // Ищем колонки
    const idx = {
      category: headers.findIndex(h => h.includes('категор') || h.includes('тип')),
      name: headers.findIndex(h => h.includes('назван') || h.includes('имя')),
      price: headers.findIndex(h => h.includes('цена') || h.includes('стоим')),
      weight: headers.findIndex(h => h.includes('вес') || h.includes('грамм')),
      desc: headers.findIndex(h => h.includes('описан')),
      stock: headers.findIndex(h => h.includes('налич') || h.includes('статус')),
      image: headers.findIndex(h => h.includes('картин') || h.includes('фото') || h.includes('изображ'))
    };

    if (idx.name === -1 || idx.price === -1) throw new Error('Не найдены колонки "Название" и "Цена". Проверьте заголовки.');

    let htmlOutput = '';

    rows.slice(1).forEach(row => {
      if (!row[idx.name] || !row[idx.name].trim()) return; // Пропуск пустых строк

      const name = row[idx.name] || '';
      const price = idx.price > -1 ? (row[idx.price] || '') : '';
      const weight = idx.weight > -1 ? (row[idx.weight] || '') : '';
      const category = idx.category > -1 ? (row[idx.category] || '') : '';
      const stock = idx.stock > -1 ? (row[idx.stock] || '').toLowerCase() : '';
      const image = idx.image > -1 ? (row[idx.image] || '') : '';

      const isAvailable = !stock.includes('нет');
      const opacity = isAvailable ? '1' : '0.5';
      
      // Определяем стиль для картинки или текстовой заглушки
      const visualStyle = image 
        ? `background-image: url('${image}'); background-size: cover; background-position: center; color: transparent;` 
        : `color: var(--sage);`;

      const fallbackChar = category ? category.charAt(0) : '茶';

      htmlOutput += `
    <!-- Карточка: ${name} -->
    <div class="tq-tile tq-product" style="opacity: ${opacity};">
      <div class="tq-product-visual" style="${visualStyle}">
        ${!image ? fallbackChar : ''}
      </div>
      <div class="tq-product-info">
        <h4>${name} ${weight ? '<span style="font-size: 0.8em; color: var(--muted);">(' + weight + ')</span>' : ''}</h4>
        <span class="price">${price}</span>
      </div>
    </div>`;
    });

    outputCode.value = htmlOutput;
    outputBlock.style.display = 'block';
    
    status.className = 'status success';
    status.textContent = `Успешно! Сгенерировано ${rows.length - 1} карточек. Скопируйте код ниже.`;

  } catch (err) {
    status.className = 'status error';
    status.textContent = 'Ошибка: ' + err.message;
    console.error(err);
  }
}

// CSV Парсер
function parseCSV(text) {
  const lines = [];
  let currentLine = [];
  let currentCell = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const nextChar = text[i + 1];

    if (inQuotes) {
      if (char === '"' && nextChar === '"') {
        currentCell += '"';
        i++;
      } else if (char === '"') {
        inQuotes = false;
      } else {
        currentCell += char;
      }
    } else {
      if (char === '"') {
        inQuotes = true;
      } else if (char === ',') {
        currentLine.push(currentCell);
        currentCell = '';
      } else if (char === '\n' || (char === '\r' && nextChar === '\n')) {
        if (char === '\r') i++; 
        currentLine.push(currentCell);
        lines.push(currentLine);
        currentLine = [];
        currentCell = '';
      } else {
        currentCell += char;
      }
    }
  }
  if (currentCell || currentLine.length > 0) {
    currentLine.push(currentCell);
    lines.push(currentLine);
  }
  return lines;
}
</script>
</body>
</html>
